<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page Not Found | Perry &amp; Gambill LLC</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;1,8..60,400&display=swap" rel="stylesheet">
  <style>
    /* Self-contained so it renders correctly at any URL depth */
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #13202a;
      color: #fff;
      font: 17px/1.6 "Inter", system-ui, sans-serif;
      text-align: center;
      padding: 16px;
    }
    .code { font: italic 400 15px "Source Serif 4", Georgia, serif; color: #d5b37b; letter-spacing: 0.1em; }
    h1 { font: 400 clamp(36px, 6vw, 56px)/1.1 "Source Serif 4", Georgia, serif; margin: 12px 0 16px; }
    p { color: #a9b6c0; margin: 0 0 32px; }
    a {
      display: inline-block;
      padding: 14px 24px;
      border-radius: 6px;
      background: #d5b37b;
      color: #13202a;
      font-weight: 600;
      text-decoration: none;
    }
    a:hover { background: #e2c491; }
  </style>
</head>
<body>
  <main>
    <div class="code">404</div>
    <h1>Page not found</h1>
    <p>The page you're looking for doesn't exist or has moved.</p>
    <a href="/">Return home</a>
  </main>
</body>
</html>
