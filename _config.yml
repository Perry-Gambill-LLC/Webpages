# Site settings ---------------------------------------------------------------
title: Perry & Gambill LLC
tagline: Real Estate, Venture Capital & Software
description: Capital, expertise, and technology, put to work for the communities we serve.
email: support.perrygambill@icloud.com   # default contact/support email across the site
domain: https://www.perrygambill.com      # used for canonical links and social previews
app_terms_url: https://www.apple.com/legal/internet-services/itunes/dev/stdeula/   # default Terms of Service for app pages (Apple's standard EULA); override per app with terms_url

# Languages -------------------------------------------------------------------
# The site is written in US English. App pages are published per language at
# /apps/<app>/<lowercase code>/: English from _apps/<app>.md at /apps/<app>/en-us/,
# and each translation from _apps/<lowercase code>/<app>.md. /apps/<app>/ redirects
# to the English page. Interface text for every language lives in _data/i18n.yml.
lang: en-US
translations:
  - es-MX   # Mexican Spanish
  - pt-BR   # Brazilian Portuguese

# Build settings --------------------------------------------------------------
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

plugins:
  - jekyll-redirect-from
  - jekyll-sitemap

# Each file in _apps/ becomes a support + privacy page at /apps/<file-name>/
collections:
  apps:
    output: true
    permalink: /apps/:name/

defaults:
  - scope:
      type: apps
    values:
      layout: app
      nav: apps
      lang: en-US
      permalink: /apps/:name/en-us/
  - scope:
      path: _apps/es-mx
      type: apps
    values:
      lang: es-MX
      permalink: /apps/:name/es-mx/
  - scope:
      path: _apps/pt-br
      type: apps
    values:
      lang: pt-BR
      permalink: /apps/:name/pt-br/

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - _templates
  - scripts
  - CLAUDE.md
